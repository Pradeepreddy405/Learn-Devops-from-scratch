<text x="1130.0" y="273" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0f172a">Backend</text>
<text x="1130.0" y="301" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Private app</text>
<text x="600" y="455" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Requests move left to right; responses generally return along the reverse path.</text>
