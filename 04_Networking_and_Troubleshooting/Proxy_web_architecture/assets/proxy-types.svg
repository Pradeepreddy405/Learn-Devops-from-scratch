<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="600" y="75" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#0f172a">Forward and reverse proxy</text>
<text x="600" y="115" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Conceptual architecture — adapt addresses, ports and services to your environment</text>
<rect x="-35" y="235" width="210" height="92" rx="16" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="70.0" y="273" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0f172a">Client</text>
<text x="70.0" y="301" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Internal user</text>
<line x1="175" y1="281.0" x2="220" y2="281.0" stroke="#475569" stroke-width="4"/>
<polygon points="220,281.0 205,272.0 205,290.0" fill="#475569"/>
<rect x="230" y="235" width="210" height="92" rx="16" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="335.0" y="273" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0f172a">Forward proxy</text>
<text x="335.0" y="301" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Represents clients</text>
<line x1="440" y1="281.0" x2="485" y2="281.0" stroke="#475569" stroke-width="4"/>
<polygon points="485,281.0 470,272.0 470,290.0" fill="#475569"/>
<rect x="495" y="235" width="210" height="92" rx="16" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<text x="600.0" y="273" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0f172a">Internet</text>
<text x="600.0" y="301" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">External services</text>
<line x1="705" y1="281.0" x2="750" y2="281.0" stroke="#475569" stroke-width="4"/>
<polygon points="750,281.0 735,272.0 735,290.0" fill="#475569"/>
<rect x="760" y="235" width="210" height="92" rx="16" fill="#e0e7ff" stroke="#334155" stroke-width="2"/>
<text x="865.0" y="273" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#0f172a">Reverse proxy</text>
<text x="865.0" y="301" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">Represents servers</text>
<line x1="970" y1="281.0" x2="1015" y2="281.0" stroke="#475569" stroke-width="4"/>
<polygon points="1015,281.0 1000,272.0 1000,290.0" fill="#475569"/>
